# Render Blueprint for the FastAPI backend. See DEPLOYMENT.md.
services:
  - type: web
    name: aivoa-qms-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Set in the dashboard, e.g. "https://your-app.vercel.app,http://localhost:5173".
      # sync: false so Blueprint syncs never overwrite it.
      - key: ALLOWED_ORIGINS
        sync: false
